# Desktop release: one tag -> installers for macOS, Windows and Linux.
# Electron installers must be produced ON the target OS (codesign, squirrel,
# dpkg), so this is the one job in the template that uses hosted runners per
# platform instead of the shared Hanzo build fleet.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npm run make
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*.deb
            out/make/**/*.rpm
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
